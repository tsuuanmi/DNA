name: CI

on:
  push:
    branches: ["main"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  rust-quality:
    name: Rust quality
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
      - name: Toolchain
        run: rustc --version && cargo --version
      - name: Format
        run: cargo fmt --all --check
      - name: Check
        run: cargo check --locked --all-targets
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Test
        run: cargo test --locked --all-targets
      - name: Rustdoc
        env:
          RUSTDOCFLAGS: -D warnings
        run: cargo doc --locked --no-deps
      - name: Release build
        run: cargo build --locked --release

  dependency-audit:
    name: Dependency audit
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install cargo-audit
        run: cargo install cargo-audit --version 0.22.2 --locked
      - name: Audit Cargo.lock
        run: cargo audit

  msrv:
    name: MSRV 1.85
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Install declared minimum Rust
        run: rustup toolchain install 1.85.0 --profile minimal
      - name: Check declared MSRV
        run: cargo +1.85.0 check --locked --all-targets

  repository-policy:
    name: Repository policy and Python tooling
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          python-version: "3.12"
          version: "0.12.17"
      - name: Install locked Python tooling
        run: uv sync --project tools/python --frozen
      - name: Enforce Rust-only production source
        shell: bash
        run: |
          unexpected="$(find src -type f ! -name '*.rs' -print)"
          if [ -n "$unexpected" ]; then
            printf 'Only Rust source is allowed under src/:\n%s\n' "$unexpected" >&2
            exit 1
          fi
      - name: Validate Rust source policy
        working-directory: tools/python
        run: uv run python scripts/validate_rust_source_policy.py
      - name: Ruff format
        working-directory: tools/python
        run: uv run ruff format --check scripts tests
      - name: Ruff check
        working-directory: tools/python
        run: uv run ruff check scripts tests
      - name: Basedpyright
        working-directory: tools/python
        run: uv run basedpyright scripts tests
      - name: Python tests
        working-directory: tools/python
        run: uv run python -m unittest discover -s tests -p 'test_*.py'
      - name: Validate result schemas
        working-directory: tools/python
        run: uv run python scripts/validate_result_schemas.py
      - name: Validate configuration template
        run: |
          uv run --project tools/python python -c 'import pathlib, tomllib; tomllib.loads(pathlib.Path("config/dna.toml").read_text())'
          set -a
          source .env.example
          test "$DNA_CONFIG" = "config/dna.toml"
          test "$DNA_LOG_DIR" = "logs"
      - name: Validate rCRS reference
        shell: bash
        run: |
          test "$(sha256sum references/rCRS.fasta | cut -d' ' -f1)" = "f0f08344920d29af5f0870f7b2c7b5a880e338b10b41d3536a0db7e6e5cd724a"
          test "$(awk '!/^>/ { gsub(/[[:space:]]/, ""); n += length } END { print n }' references/rCRS.fasta)" = "16569"
