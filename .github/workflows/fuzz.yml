name: Fuzz

on:
  push:
    branches: ["main"]
  pull_request:
  schedule:
    - cron: "43 1 * * 0"
  workflow_dispatch:

concurrency:
  group: fuzz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  abif:
    name: ABIF fuzz smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install nightly Rust
        run: rustup toolchain install nightly-2026-09-01 --profile minimal
      - name: Install cargo-fuzz
        run: cargo +nightly-2026-09-01 install cargo-fuzz --version 0.13.2 --locked
      - name: Fuzz ABIF parser
        env:
          FUZZ_SECONDS: ${{ github.event_name == 'schedule' && '300' || '30' }}
        run: cargo +nightly-2026-09-01 fuzz run abif_parse -- -max_total_time="$FUZZ_SECONDS" -rss_limit_mb=2048
