name: Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: ["main"]

concurrency:
  group: release-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'push' }}

permissions: {}

env:
  RELEASE_TARGET: x86_64-unknown-linux-gnu
  RELEASE_LABEL: ${{ github.event_name == 'push' && github.ref_name || format('pr-{0}', github.event.pull_request.number) }}

jobs:
  package:
    name: Release package
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Verify release identity
        if: github.event_name == 'push'
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' Cargo.toml | head -1)"
          test "$GITHUB_REF_NAME" = "v$version"
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main
      - name: Verify release revision
        if: github.event_name == 'push'
        run: |
          cargo fmt --all --check
          cargo check --locked --all-targets --all-features
          cargo clippy --locked --all-targets --all-features -- -D warnings
          cargo test --locked --all-targets --all-features
          RUSTDOCFLAGS="-D warnings" cargo doc --locked --no-deps --all-features
      - name: Dependency policy
        if: github.event_name == 'push'
        uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1 / cargo-deny 0.20.2
        with:
          command: check
      - name: Install release target
        run: rustup target add "$RELEASE_TARGET"
      - name: Install release audit tooling
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          cargo install cargo-auditable --version 0.7.6 --locked
      - name: RustSec lockfile audit
        if: github.event_name == 'push'
        run: cargo audit
      - name: Build auditable release binary
        run: cargo auditable build --locked --release --target "$RELEASE_TARGET"
      - name: Prepare artifact and provenance
        shell: bash
        run: |
          mkdir -p dist/package/config dist/package/references dist/staging
          cp "target/${RELEASE_TARGET}/release/dna" dist/package/dna
          cp config/dna.toml dist/package/config/dna.toml
          cp references/rCRS.fasta dist/package/references/rCRS.fasta
          strip --keep-section=.dep-v0 dist/package/dna
          rustc --version --verbose > dist/package/rustc-version.txt
          cargo --version --verbose > dist/package/cargo-version.txt
          git rev-parse HEAD > dist/package/source-revision.txt
          sha256sum Cargo.lock > dist/package/Cargo.lock.sha256
          (
            cd dist/package
            sha256sum config/dna.toml > config/dna.toml.sha256
            sha256sum references/rCRS.fasta > references/rCRS.fasta.sha256
          )
      - name: Verify packaged binary and runtime assets
        shell: bash
        run: |
          readelf -S dist/package/dna | grep -F '.dep-v0'
          cargo audit bin dist/package/dna
          (
            cd dist/package
            sha256sum -c config/dna.toml.sha256
            sha256sum -c references/rCRS.fasta.sha256
            ./dna --help >/dev/null
          )
      - name: Generate SPDX SBOM
        uses: anchore/sbom-action@3ad7283483fc7af8ff2b4ea19663c2d5ca935e26 # v0.24.2
        with:
          file: dist/package/dna
          format: spdx-json
          output-file: dist/dna-${{ env.RELEASE_LABEL }}-${{ env.RELEASE_TARGET }}.spdx.json
          upload-artifact: false
          upload-release-assets: false
          syft-version: v1.52.0
      - name: Package release
        shell: bash
        run: |
          cp dist/package/dna dist/staging/dna
          cp "dist/dna-${RELEASE_LABEL}-${RELEASE_TARGET}.spdx.json" dist/package/SBOM.spdx.json
          tar -C dist/package -czf "dist/dna-${RELEASE_LABEL}-${RELEASE_TARGET}.tar.gz" .
          rm -rf dist/package
          sha256sum \
            "dist/dna-${RELEASE_LABEL}-${RELEASE_TARGET}.tar.gz" \
            "dist/dna-${RELEASE_LABEL}-${RELEASE_TARGET}.spdx.json" \
            > dist/SHA256SUMS
      - name: Verify packaged release
        shell: bash
        run: |
          (
            cd dist
            sha256sum -c SHA256SUMS
            tar -tzf "dna-${RELEASE_LABEL}-${RELEASE_TARGET}.tar.gz" >/dev/null
          )
      - name: Stage verified release assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-assets
          path: |
            dist/dna-${{ env.RELEASE_LABEL }}-${{ env.RELEASE_TARGET }}.tar.gz
            dist/dna-${{ env.RELEASE_LABEL }}-${{ env.RELEASE_TARGET }}.spdx.json
            dist/SHA256SUMS
            dist/staging/dna
          if-no-files-found: error
          retention-days: 1

  attest:
    name: Attest release assets
    if: github.event_name == 'push'
    needs: package
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - name: Verify staged checksums
        run: |
          (
            cd dist
            sha256sum -c SHA256SUMS
          )
      - name: Attest binary SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/staging/dna
          sbom-path: dist/dna-${{ env.RELEASE_LABEL }}-${{ env.RELEASE_TARGET }}.spdx.json
      - name: Attest release archive provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/dna-${{ env.RELEASE_LABEL }}-${{ env.RELEASE_TARGET }}.tar.gz

  publish:
    name: Publish GitHub release
    if: github.event_name == 'push'
    needs:
      - package
      - attest
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      actions: read
      contents: write
    steps:
      - name: Download verified release assets
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-assets
          path: dist
      - name: Verify staged checksums
        run: |
          (
            cd dist
            sha256sum -c SHA256SUMS
          )
      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/dna-${RELEASE_LABEL}-${RELEASE_TARGET}.tar.gz" \
            "dist/dna-${RELEASE_LABEL}-${RELEASE_TARGET}.spdx.json" \
            dist/SHA256SUMS \
            --verify-tag \
            --generate-notes \
            --repo "$GITHUB_REPOSITORY"
