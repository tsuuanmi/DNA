description = "Python-only research, validation, and test tooling for the Rust DNA core."
requires-python = ">=3.12"
dependencies = []

[dependency-groups]
dev = [
  "basedpyright",
  "jsonschema",
  "ruff",
]

[tool.uv]
package = false

[tool.basedpyright]
typeCheckingMode = "basic"
