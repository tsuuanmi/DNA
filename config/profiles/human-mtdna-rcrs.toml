# Human mtDNA control region against the revised Cambridge Reference Sequence
# (rCRS, NC_012920.1). Target knowledge only: method parameters live in the
# scientific configuration that references this profile.
schema_version = 2
id = "human-mtdna-rcrs"

[reference]
# SHA-256 of the normalized rCRS sequence; a run against another reference fails.
sequence_sha256 = "f156ff3f65bbcc80c7ebb9936dceb96b1477b4f8f535c4e1dbe7baea225cbc66"
topology = "circular"

[variant_calling]
# Inclusive 1-based reportable regions: HVS-I, HVS-II, HVS-III.
regions = [[16024, 16365], [73, 340], [438, 576]]

[normalization]
# Forensic mtDNA convention: 3'/right-most indel placement, never across the seam.
indel_placement = "right"
# Farthest a deletion moves 3' past substitutions in one trade: twice the
# longest trade over the lab's reviewed corpus (10 bases, 513DEL to 523DEL).
max_trade = 20

[notation]
# One call per changed base: 73G, 249DEL, 309.1C.
style = "per_base_decimal"

# Repeat windows whose sequence-equivalent haplotypes take one representation:
# the form the lab's reviewers write (ADR-0077). Rules are tried in order; the
# first whose candidate reproduces the window haplotype wins.
[[nomenclature.windows]]
name = "HVS-II"
start = 303
sequence = "CCCCCCCTCCCCC"
structure = { kind = "anchored_homopolymer", repeat_base = "C", anchor = 310, anchor_base = "T" }
rules = ["anchored_run_lengths", "anchor_duplication", "anchor_deletion", "terminal_repeat_insertion"]

[[nomenclature.windows]]
name = "HVS-III"
start = 512
sequence = "AGCACACACACAC"
structure = { kind = "tandem_repeat", motif = "AC", read_copies = 2 }
rules = ["motif_shift"]

[[nomenclature.windows]]
name = "HVS-I"
start = 16180
sequence = "AAAACCCCCTCCCC"
structure = { kind = "anchored_homopolymer", repeat_base = "C", anchor = 16189, anchor_base = "T" }
rules = ["canonical_haplotype", "anchored_tract", "anchor_deletion"]
canonical_haplotype = [
  { position = 16183, base = "C" },
  { position = 16184, base = "A" },
  { position = 16189, base = "C" },
]

# Report conventions: calls the lab's reviewers do not record. A covered call
# is labelled in every notation view and kept; the haplotype is unchanged
# (SRS-NOM-017). The reviewers do not record the length of the uninterrupted
# HVS-I C run that 16189C creates (C10 and longer); with T16189 the two short
# runs are read through, and their length calls stay unlabelled.
[[nomenclature.conventions]]
name = "hvs1_c_length"
label = "not_recorded"
kind = "run_length"
window = [16180, 16193]
base = "C"
minimum_run = 10

# Notation conventions the `notation` command checks represented calls against;
# findings are reported, never applied. Following EMPOP/ISFG practice in the
# control-region C stretches, a homopolymer length variant is written as an
# insertion of the run's base after its 3' base, and another base inside a run
# as a substitution.
[conformance]
rules = ["insertion_at_run_end", "insertion_matches_run"]
minimum_run_length = 4

# The `notation` command exports an offline EMPOP query: interpretation ranges
# over the positions the sample's records call, in the region order above
# (HVS-I, HVS-II, HVS-III), and the rCRS-coded mitotype inside them. EMPOP reads
# an omission inside a range as the reference, so a range never covers a
# position DNA left undecided or excluded (PROP-0007). It takes no keys.
[empop]

# C tracts with length heteroplasmy: the homopolymer length varies within a
# sample (polymerase slippage and true length heteroplasmy cannot be told
# apart in Sanger signal). A length there whose dominant the reads determine
# is noted, not checked, and searches disregard length variants over
# `search` (ISFG, Parson et al. 2014, Rec. 10, 11, 16; SWGDAM 2024 5.1.1;
# EMPOP standard query windows). The tracts' composition (16189C, T310C) and
# 315.1C, a phylogenetically stable insertion, are called and checked as
# usual: HVS-II's tract is its first run only. In reference order.
[[length_tracts]]
name = "hvs2_c_tract"
window = [303, 309]
base = "C"
search = [302, 316]

[[length_tracts]]
name = "hvs3_c_tract"
window = [568, 573]
base = "C"
search = [567, 574]

[[length_tracts]]
name = "hvs1_c_tract"
window = [16184, 16193]
base = "C"
search = [16189, 16194]
