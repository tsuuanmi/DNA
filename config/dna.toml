# DNA scientific configuration. Unknown or missing keys are errors.
schema_version = 20
# Target profile (reference identity and topology, reportable regions,
# representation chain), resolved against this file's directory.
profile = "profiles/human-mtdna-rcrs.toml"

[basecalling]
# A channel's selected peak and signal at the primary peak must reach this fraction.
secondary_peak_ratio = 0.33

[signal_processing]
# Observation-only rolling SNR annotation; it does not alter scientific calls.
window_size_bases = 10
minimum_primary_snr = 3.0
# At least two candidate windows are required for a noisy interval.
minimum_noisy_windows = 2
# Floor of a channel's noise scale, in signal units.
minimum_noise_sigma = 1.0
# The canonical second-channel threshold (PROP-0009): a call's second peak
# share stands out above max(second_floor, its key's run level), the run level
# being median + max(margin, mad_factor * MAD) when the run signal holds at
# least the minimum reads and the key at least the minimum calls. A run
# signal's key is the context of run_signal_flank calls on each side of a call
# (a 5-mer at 2), and it counts shares in run_signal_resolution steps; a run
# signal made with other values is refused.
second_floor = 0.20
run_signal_flank = 2
run_signal_resolution = 1000
run_signal_minimum_reads = 40
run_signal_minimum_calls = 40
run_signal_margin = 0.05
run_signal_mad_factor = 4.0
# Labels for why a call shows a second peak above second_floor (SRS-CALL-021),
# from the peak's shape; they decide nothing. A second peak below
# second_cause_noise_ratio times the call's lowest channel is noise; one at
# least second_cause_tail_offset call spacings off the call's centre is a
# neighbour's tail or off centre; a centred one at least
# second_cause_blob_width times as wide as the median primary peak of the
# second_cause_width_calls calls on each side is a dye blob.
second_cause_noise_ratio = 3.0
second_cause_tail_offset = 0.4
second_cause_blob_width = 1.8
second_cause_width_calls = 6
# A dephased segment after a repeat run is fitted as the read's own sequence
# mixed with copies offset by whole calls (SRS-CALL-023). A call of it is
# unexplained when its residual exceeds this nearest-rank quantile of the
# residuals of the read's own in-phase calls.
decompose_unexplained_quantile = 0.99

[callability]
# Signal-derived read callability (ADR-0067): rolling window of calls, the
# defect fractions that open and close a masked stretch, the shadow-fit shares
# that separate dephased (slippage) signal from mixed signal, and the fraction
# of the read's median primary amplitude below which a position is weak.
# Repeat runs of at least `repeat_min_length` identical or alternating primary
# calls are priors for the window after them; a read needs at least
# `minimum_callable_calls` callable calls to be analyzed.
window_calls = 16
onset_defect_fraction = 0.375
exit_defect_fraction = 0.125
minimum_main_share = 0.35
maximum_far_share = 0.12
minimum_shadow_share = 0.1
weak_amplitude_fraction = 0.2
repeat_min_length = 8
minimum_callable_calls = 20
# Calls after a repeat run that form its prior window.
repeat_window_calls = 16
# A position carries a double peak when its secondary ratio reaches this.
double_peak_ratio = 0.33
# A position is a spacing defect when its spacings deviate this much from the
# median of the `spacing_half_window` spacings on each side.
spacing_defect = 0.5
spacing_half_window = 8

[quality_control]
# Relative, uncalibrated per-call quality. The trim interval is the read's
# callable span (ADR-0067).
penalty_window_size = 10
max_relative_quality_score = 60
# The trim keeps up to this many calls of an adjacent dephased segment past
# the callable span, so they can anchor the alignment.
trim_context_margin = 12

[alignment]
# Semi-global affine-gap scoring. A length-k gap costs open + k * extension.
match_score = 3
mismatch_score = -5
ambiguous_score = 0
gap_open_score = -10
gap_extension_score = -4
minimum_callable_bases = 20
minimum_identity = 0.80
# Longest reference stretch, in bases, a run-structure re-expression spans.
max_stretch = 64

[sample_reconciliation]
# Tracy-derived pre-consensus overlap admission, applied after independent placement.
minimum_comparable_bases = 25
minimum_overlap_agreement = 0.50

[sanger_evidence]
# Sanger support vetoes (ADR-0069): an SNV or inserted-base supporting call
# needs a highest A/C/G/T peak of at least `minimum_peak_height` and a relative
# quality above `relative_quality_threshold`. An insertion into a repeat the
# read bounds passes when some placement of it along the repeat does
# (SRS-VAR-020).
minimum_peak_height = 150
relative_quality_threshold = 30
# A call below the peak floor whose relative quality is at least
# `peak_rescue_quality` still shows its base and indel: a low
# absolute peak at a weak read end or in a weak dye context is not a doubtful
# base when the call stands clear of its neighbourhood.
peak_rescue_quality = 50
# ... and whose second base holds less than `peak_rescue_second_share` of the
# two strongest peaks: a low peak beside a strong second base is the split
# signal of two templates, so it stays withheld.
peak_rescue_second_share = 0.20
# Read-edge rules (SRS-CALL-013 to SRS-CALL-018). Calls within
# `signal_edge_margin` of an end of the usable signal lie at a signal edge.
signal_edge_margin = 12
# Leading calls vouched for by their base need a primary peak of at least this
# fraction of the read's median.
leading_height_fraction = 1.0
# A run bounded before a post-repeat phase loss: more than
# `post_repeat_margin`, or at least `post_repeat_minimum_calls` beside that
# loss, informative calls on each side.
post_repeat_margin = 12
post_repeat_minimum_calls = 2
# An edge call within `edge_identity_margin` of an informative end, or a start
# call within `start_identity_margin` of the callable span's start, is vouched
# for by its own signal when it is clean: a primary peak of at least the
# height fraction of the median (the start's own median of its first
# `start_norm_calls` calls), a second-channel share below
# `edge_second_share` (`start_second_share` at the start), a peak no wider than
# `edge_width_factor` times the median width, and a spacing to each neighbour
# between the spacing minimum and maximum times the median spacing. A start
# call reads its predecessor's base only behind a vouched call.
edge_identity_margin = 12
edge_height_fraction = 1.0
start_identity_margin = 12
start_norm_calls = 30
start_height_fraction = 0.5
start_second_share = 0.15
edge_second_share = 0.10
edge_width_factor = 1.5
edge_spacing_minimum = 0.5
edge_spacing_maximum = 1.5


[trace]
# A read's homopolymer tracts, decoded from its own signal (PROP-0012
# increment 2): evidence only, nothing decides on it yet. Before each call
# where the read leaves phase, the tract is the latest run of at least
# locate_min_run equal primaries, extended back over a single-call mark that
# at least locate_min_before run-base calls precede. Its candidate total
# lengths run from span_below calls under the run extent (at least
# min_length) to span_above over it; the fit reads downstream_calls more.
# joint_lengths (at most 8) and iterations are computation caps, logged when
# they bind. The read's signature and leakage null read at most
# signature_calls calls before the tract, leaving signature_gap out, and away
# from runs of leak_min_run (padded by leak_pad), with at least
# leak_min_calls calls. A marginal's top two lengths are near-equal when
# their margin, deflated by the read's residual autocorrelation, is below
# near_equal_z standard errors.
locate_min_run = 4
locate_min_before = 2
span_below = 10
span_above = 3
min_length = 3
downstream_calls = 60
joint_lengths = 6
iterations = 6
signature_calls = 200
signature_gap = 3
leak_min_run = 3
leak_pad = 2
leak_min_calls = 10
near_equal_z = 2.0

[variant_calling]
# Anchor bases do not count toward this changed-length limit.
max_indel_length = 50
# Read callability (ADR-0062, ADR-0067): calls this close to an uninformative
# call (beyond the trim interval or masked as unresolved) cannot support a
# variant.
read_end_margin = 12

[consensus]
# A disputed homopolymer no read bounds is grown as one stretch from this
# length on (SRS-CONS-004).
seeded_run = 4
# A segment keeps up to `maximum_undecided_gap` undecided positions between
# decided sites as N, and needs at least `minimum_resolved_bases` resolved
# bases.
maximum_undecided_gap = 20
minimum_resolved_bases = 20
# Costs of aligning a decided site's call to its reference interval: they
# must satisfy mismatch + extension > open and mismatch < 2 * open.
site_mismatch_cost = 2
site_gap_open_cost = 3
site_gap_extension_cost = 2
# An insertion or deletion within `dissent_edge` calls of its read's ends,
# against a reference decision, is set aside when a read of the other strand
# reads the site cleanly at least this far from its own ends (SRS-CONS-011).
dissent_edge = 40

[review]
# A decided run longer than its reference run by at least `run_growth` bases
# is a check when its length rests on an anchored end or a single read: both
# strands must show it in phase to assure it.
run_growth = 3
# When a reportable region's end is not analysed (SRS-CONS-012), any
# difference within `edge_zone` positions of it is a check: its reads there
# sit right after their poor start.
edge_zone = 40
# A deletion that rests on a single read within `deletion_zone` positions of a
# reportable region's first or last position is a check: the read's own edge
# is where a lost or doubled base looks like a deletion.
deletion_zone = 20
# A read reads the end of an item that its strand reaches first in phase, up to
# where it has read `phase_run` equal bases in a row; a clean base there that
# differs from the decision makes the item a check. The far end of the run is
# a length question that dephasing leaves open, so it is not compared.
phase_run = 4
